name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: windows-x86_64

      - name: Set version
        shell: bash
        run: |
          sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml
          echo "Version set to ${{ inputs.version }}"
          grep '^version' Cargo.toml

      - name: Cargo build --release
        shell: bash
        env:
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: |
          cargo build --target x86_64-pc-windows-msvc --release -p codex-cli -p codex-windows-sandbox

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-windows-x86_64-v${{ inputs.version }}
          path: |
            codex-rs/target/x86_64-pc-windows-msvc/release/codex.exe
            codex-rs/target/x86_64-pc-windows-msvc/release/codex-windows-sandbox-setup.exe
